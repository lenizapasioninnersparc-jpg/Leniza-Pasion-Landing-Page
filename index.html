  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leniza Pasion · Tahanan Natin</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f4ed;
    }

    #app {
      width: 100%;
      height: 100vh;
      border: 0;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f4ed;
      font-family: Arial, sans-serif;
      color: #1a2d5a;
      z-index: 10;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid #ddd;
      border-top-color: #1a2d5a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader">
      <div class="spinner"></div>
      <div>Loading Tahanan Natin...</div>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbzovvy5gOgf0piIqXSlpbZIS7mxGSjo8dcn594HNeay_zPjHDHd_4eF-AlLlJ7i4tyo/exec"
    allow="clipboard-write"
  ></iframe>

  <script>
    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');

    iframe.addEventListener('load', function() {
      loading.style.display = 'none';
    });
  </script>

</body>
</html>
